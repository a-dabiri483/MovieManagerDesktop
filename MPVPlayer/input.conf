# ==========================================
# 🎮 MOVIEMANAGER DESKTOP - MPV INPUT CONFIG
# ==========================================

# ── میانبرهای ماوس (Mouse Buttons) ──
MBTN_LEFT_DBL       cycle pause
MBTN_RIGHT          script-binding context_menu/open_context_menu
MBTN_BACK           seek -5 exact
MBTN_FORWARD        seek 5 exact
MBTN_MID            cycle fullscreen

# ── اسکرول ماوس (Volume with OSD) ──
WHEEL_UP            add volume 5; show-text "صدا: ${volume}%"
WHEEL_DOWN          add volume -5; show-text "صدا: ${volume}%"
Shift+WHEEL_UP      seek 10 exact
Shift+WHEEL_DOWN    seek -10 exact

# ── کلیدهای ناوبری و جهت‌نما ──
SPACE               cycle pause
p                   cycle pause
P                   cycle pause

PGDWN               playlist-next
>                   playlist-next
PGUP                playlist-prev
<                   playlist-prev

LEFT                seek -5 exact
RIGHT               seek 5 exact
Ctrl+LEFT           seek -30 exact
Ctrl+RIGHT          seek 30 exact
Shift+LEFT          seek -60 exact
Shift+RIGHT         seek 60 exact
UP                  add volume 5; show-text "صدا: ${volume}%"
DOWN                add volume -5; show-text "صدا: ${volume}%"

# ── زیرنویس و صدا ──
l                   cycle sub
L                   cycle sub
v                   cycle sub-visibility
V                   cycle sub-visibility
.                   add sub-delay 0.5; show-text "تاخیر زیرنویس: ${sub-delay}s"
,                   add sub-delay -0.5; show-text "تاخیر زیرنویس: ${sub-delay}s"
/                   set sub-delay 0; set audio-delay 0; show-text "سینک زیرنویس و صدا ریست شد"

a                   cycle audio
A                   cycle audio
m                   cycle mute; show-text "بی‌صدا: ${mute}"
M                   cycle mute; show-text "بی‌صدا: ${mute}"

# ── سرعت و کنترل تصویر ──
z                   set speed 1.0; show-text "سرعت: 1.0x"
Z                   set speed 1.0; show-text "سرعت: 1.0x"
c                   add speed 0.1; show-text "سرعت: ${speed}x"
C                   add speed 0.1; show-text "سرعت: ${speed}x"
x                   add speed -0.1; show-text "سرعت: ${speed}x"
X                   add speed -0.1; show-text "سرعت: ${speed}x"
]                   set speed 1.25; show-text "سرعت: 1.25x"
}                   set speed 1.5; show-text "سرعت: 1.5x"
"                   set speed 2.0; show-text "سرعت: 2.0x"
[                   set speed 0.75; show-text "سرعت: 0.75x"

ENTER               cycle fullscreen
f                   cycle fullscreen
F                   cycle fullscreen
k                   screenshot
K                   screenshot
s                   screenshot
S                   screenshot

ESC                 quit
F4                  quit
q                   quit
